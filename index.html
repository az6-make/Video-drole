<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIRUS</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}
body{
    position:fixed;
    inset:0;
    cursor:default;
    width:100vw;
    height:100vh;
    width:100dvw;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
canvas{
    display:block;
    width:100%;
    height:100%;
    background:#000;
}
.inapp-browser-modal {
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
}
.inapp-browser-content {
    background:#fff;
    border-radius:12px;
    padding:32px 24px;
    max-width:320px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
}
.inapp-browser-content h2 {
    font-size:18px;
    font-weight:600;
    margin-bottom:16px;
    color:#000;
}
.inapp-browser-content p {
    font-size:14px;
    color:#666;
    margin-bottom:24px;
    line-height:1.5;
}
.inapp-browser-btn {
    background:#007AFF;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px 24px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background 0.2s;
}
.inapp-browser-btn:active {
    background:#0051D5;
}
.hidden {
    display:none !important;
}
.error-message {
    color:#d32f2f;
    font-size:13px;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid #e0e0e0;
    display:none;
}
.error-message.show {
    display:block;
}
</style>
</head>
<body>
<div class="inapp-browser-modal hidden" id="inappModal">
    <div class="inapp-browser-content">
        <h2>Ouvrir dans le navigateur</h2>
        <p>Voulez-vous ouvrir cette page dans votre navigateur ?</p>
        <button class="inapp-browser-btn" id="openBrowserBtn">Ouvrir dans le navigateur</button>
        <div class="error-message" id="errorMessage">
            Votre navigateur intégré bloque l'ouverture automatique. Utilisez l'option "Ouvrir dans le navigateur" du menu de l'application.
        </div>
    </div>
</div>
<canvas id="virus" class="hidden"></canvas>
<script>
(() => {
    // ÉTAPE 1 : DÉTECTION IN-APP BROWSER AU CHARGEMENT (AVANT TOUT)
    function isInAppBrowser() {
        const ua = navigator.userAgent.toLowerCase();
        const inAppBrowsers = /snapchat|instagram|tiktok|facebook|messenger|whatsapp|fban|fbav|x\.com|reddit|discordapp|discord|telegram|line|kakaotalk|viber|wechat|qq|douyin|weibo|xiaohongshu/i;
        const normalBrowsers = /chrome|safari|firefox|edge|opera|brave|samsung/i;
        
        if (!inAppBrowsers.test(ua)) {
            return false;
        }
        
        if (normalBrowsers.test(ua)) {
            const isMobileChrome = /chrome.*mobile/i.test(ua);
            const isMobileSafari = /safari.*mobile/i.test(ua);
            const isDesktopFF = /firefox/i.test(ua) && !/mobile/i.test(ua);
            if (isMobileChrome || isMobileSafari || isDesktopFF) {
                return false;
            }
        }
        
        return true;
    }

    // ÉTAPE 2 : SI NAVIGATEUR INTÉGRÉ -> AFFICHER MODAL BLANC ET ARRÊTER
    if (isInAppBrowser()) {
        const modal = document.getElementById("inappModal");
        const btn = document.getElementById("openBrowserBtn");
        const errorMessage = document.getElementById("errorMessage");
        const canvas = document.getElementById("virus");
        
        modal.classList.remove("hidden");
        canvas.classList.add("hidden");
        
        function openNewPage() {
            try {
                window.open(window.location.href, '_blank');
            } catch (_) {
                errorMessage.classList.add("show");
            }
        }
        
        btn.addEventListener("click", openNewPage);
        
        return;
    }

    // ÉTAPE 3 : SI NAVIGATEUR NORMAL -> INITIALISER CANVAS ET VIRUS
    const canvas = document.getElementById("virus");
    const ctx = canvas.getContext("2d");
    const particles = [];
    const COUNT = 80;
    let width = 1, height = 1;
    let last = performance.now();
    const HITBOX_MULTIPLIER = 2.0;

    // Afficher le canvas
    canvas.classList.remove("hidden");
    document.getElementById("inappModal").classList.add("hidden");

    function resize() {
        const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
        width = Math.max(1, window.innerWidth);
        height = Math.max(1, window.innerHeight);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
    }

    function makeParticle() {
        const direction = Math.random() * Math.PI * 2;
        const speed = 55 + Math.random() * 125;
        return {
            x: -40 + Math.random() * (width + 80),
            y: -30 + Math.random() * (height + 60),
            vx: Math.cos(direction) * speed,
            vy: Math.sin(direction) * speed,
            size: 12 + Math.floor(Math.random() * 14),
            phase: Math.random() * Math.PI * 2
        };
    }

    function init() {
        particles.length = 0;
        for (let i = 0; i < COUNT; i++) {
            particles.push(makeParticle());
        }
    }

    function getClosestVirus(clickX, clickY) {
        let closest = null;
        let minDistance = Infinity;

        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            const wobble = Math.sin(p.phase) * 10;
            const x = p.x + wobble;
            const y = p.y;
            
            const textWidth = p.size * 3.2;
            const textHeight = p.size * 1.2;
            
            const hitboxWidth = textWidth * HITBOX_MULTIPLIER;
            const hitboxHeight = textHeight * HITBOX_MULTIPLIER;
            
            const left = x - hitboxWidth * 0.5;
            const right = x + hitboxWidth * 0.5;
            const top = y - hitboxHeight * 0.5;
            const bottom = y + hitboxHeight * 0.5;
            
            if (clickX >= left && clickX <= right && clickY >= top && clickY <= bottom) {
                const distance = Math.hypot(clickX - x, clickY - y);
                if (distance < minDistance) {
                    minDistance = distance;
                    closest = p;
                }
            }
        }

        return closest;
    }

    function draw(now) {
        const dt = Math.min(0.035, Math.max(0.001, (now - last) / 1000));
        last = now;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#55ff55";
        ctx.shadowColor = "#55ff55";
        ctx.shadowBlur = 0;

        for (const p of particles) {
            p.phase += dt * 4;
            const wobble = Math.sin(p.phase) * 10;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            if (p.x < -80) p.x = width + 50;
            else if (p.x > width + 80) p.x = -50;

            if (p.y < -60) p.y = height + 40;
            else if (p.y > height + 60) p.y = -40;

            ctx.font = `bold ${p.size}px Consolas, monospace`;
            ctx.fillText("VIRUS", p.x + wobble, p.y);
        }

        requestAnimationFrame(draw);
    }

    function attemptFullscreen() {
        const el = document.documentElement;
        const fn = el.requestFullscreen ||
                   el.webkitRequestFullscreen ||
                   el.msRequestFullscreen;
        if (fn) {
            try {
                const result = fn.call(el);
                if (result && result.catch) result.catch(() => {});
            } catch (_) {}
        }
    }

    function openNewPage() {
        try {
            window.open(window.location.href, '_blank');
        } catch (_) {
            try {
                window.location.href = window.location.href;
            } catch (_) {}
        }
    }

    function handleCanvasInteraction(x, y) {
        const closestVirus = getClosestVirus(x, y);
        if (closestVirus) {
            openNewPage();
        } else {
            attemptFullscreen();
        }
    }

    resize();
    init();
    window.addEventListener("resize", () => {
        resize();
    });
    
    canvas.addEventListener("mousedown", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        handleCanvasInteraction(x, y);
    });
    
    canvas.addEventListener("touchstart", (e) => {
        if (e.touches.length > 0) {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            handleCanvasInteraction(x, y);
        }
    }, {passive: true});
    
    requestAnimationFrame(draw);
})();
</script>
</body>
</html>
